<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>HOD Password Reset</title></head>
<body style="margin:0;padding:0;background:#0a0a0a;font-family:system-ui,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:40px auto;">
    <tr><td style="padding:32px;background:#111;border:1px solid #222;border-radius:16px;">
      <div style="text-align:center;margin-bottom:28px;">
        <div style="display:inline-block;background:linear-gradient(135deg,#d97706,#f59e0b);padding:12px 20px;border-radius:12px;">
          <span style="color:#fff;font-weight:800;font-size:18px;letter-spacing:2px;">HOD PORTAL</span>
        </div>
      </div>
      <h2 style="color:#fff;font-size:22px;font-weight:700;margin:0 0 8px;">Password Reset Request</h2>
      <p style="color:#aaa;font-size:14px;line-height:1.6;margin:0 0 28px;">
        Hello <strong style="color:#f59e0b;">{{name}}</strong>, use the OTP below to reset your HOD account password. This code expires in <strong>10 minutes</strong>.
      </p>
      <div style="text-align:center;margin:28px 0;">
        <div style="display:inline-block;background:#1a1a1a;border:2px dashed #d97706;border-radius:12px;padding:20px 40px;">
          <span style="font-size:36px;font-weight:900;letter-spacing:12px;color:#f59e0b;">{{otp}}</span>
        </div>
      </div>
      <p style="color:#666;font-size:12px;text-align:center;margin:20px 0 0;">
        If you did not request this reset, please ignore this email and secure your account immediately.
      </p>
    </td></tr>
    <tr><td style="padding:16px;text-align:center;">
      <p style="color:#444;font-size:11px;margin:0;">Academ OS — Secure HOD Portal</p>
    </td></tr>
  </table>
</body>
</html>
